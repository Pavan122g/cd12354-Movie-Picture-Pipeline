apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: backend
          ports:
            - containerPort: 5000
          startupProbe:
            httpGet:
              path: /movies
              port: 5000
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /movies
              port: 5000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /movies
              port: 5000
            periodSeconds: 30
